<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Brand mark: the petrol chip and white serif K the navigation bar renders, so the tab, the
       installed icon and the application all read as one brand.

       The K is the Source Serif 4 Bold outline converted to a path rather than a <text> element. A
       favicon is fetched as a standalone document with no stylesheet, so the bundled webfont would
       never reach it, and every rasteriser resolves <text> against whatever fonts it happens to
       have. As a path the shape is identical everywhere, from the 16px tab to the 512px PNG.

       Corner radius follows the navigation chip: an 8px radius on a 30px box, scaled to 136/512.
       Regenerated by scripts/generate-brand-icons — see the repository notes if the mark changes. -->
  <rect width="512" height="512" rx="136" fill="#1F6F6B"/>
