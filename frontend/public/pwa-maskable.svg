<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background (no rounded corners): the launcher applies its own adaptive mask, so the
       artwork must reach every edge to avoid transparent corners showing under a rounded-square mask.
       The "N" mark stays within the central ~80% safe zone so no brand content is ever cropped. -->
  <rect width="512" height="512" fill="#F7F5F1"/>

  <g stroke="#1F6F6B" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 160 380 L 160 140" />
    <path d="M 160 140 L 352 380" />
    <path d="M 352 380 L 352 140" />
  </g>

  <g fill="#1F6F6B">
    <circle cx="160" cy="140" r="22" stroke="#F7F5F1" stroke-width="8" />
    <circle cx="160" cy="380" r="16" />
    <circle cx="352" cy="140" r="16" />
    <circle cx="352" cy="380" r="22" stroke="#F7F5F1" stroke-width="8" />
  </g>

  <circle cx="256" cy="260" r="18" fill="#D97706" stroke="#F7F5F1" stroke-width="6" />
</svg>
